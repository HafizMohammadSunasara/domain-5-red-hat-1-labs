# Lab 16 — Podman Compose (RHEL-friendly runnable variant).
# Training example, NOT production hardening; database data has no explicit named volume.
# Run from this directory: podman-compose -f podman-compose.yml up -d
version: '3.8'
services:
  web:
    image: docker.io/library/nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:Z
  db:
    image: docker.io/library/postgres:13
    environment:
      POSTGRES_PASSWORD: example
